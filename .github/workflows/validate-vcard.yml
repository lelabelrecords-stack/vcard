name: Valider la vCard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vcard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Valider les vCards .vcf (RFC 6350)
        run: |
          for f in le-label-records.vcf cartes/*.vcf; do
            echo "== $f"
            python3 .github/scripts/validate_vcard.py "$f"
          done
      - name: Valider les assets des cartes (SVG, PNG, HTML)
        run: python3 .github/scripts/validate_assets.py
