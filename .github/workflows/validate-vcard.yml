name: Valider la vCard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vcard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Valider le fichier .vcf (RFC 6350)
        run: python3 .github/scripts/validate_vcard.py le-label-records.vcf
